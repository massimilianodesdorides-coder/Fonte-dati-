# Da copiare in .github/workflows/test.yml per lanciare i test ad ogni modifica.
name: test
on:
  push:
  pull_request:
jobs:
  database-e-interfaccia:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd tools && npm install
      - run: cd tests && npm install && npx playwright install --with-deps chromium
      - run: python3 tools/build.py
      - name: Database, sicurezza, invarianti, interfaccia
        run: cd tests && npm test
      - name: Concorrenza su PostgreSQL vero
        run: cd tests && npm run test:concurrency
        env:
          PG_URL: postgres://postgres:test@localhost:5432/postgres
